[tool.poetry]
name = "voxtrace-backend"
version = "0.1.0"
description = "VoxTrace Backend - Low-quality Audio Robust Speech Recognition"
authors = ["VoxTrace Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
sqlalchemy = "^2.0.36"
aiosqlite = "^0.20.0"
python-multipart = "^0.0.18"
jiwer = "^3.0.0"
psutil = "^6.1.0"
greenlet = "^3.5.6"
mlx-whisper = "^0.4.3"
silero-vad = "^6.2.3"
torchaudio = "^2.11.1"
python-dotenv = "^1.2.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
